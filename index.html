<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Snake</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    font-family: Arial, sans-serif;
}

body {
    color: white;
}

#navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 64px;
    background: rgba(5, 5, 5, 0.95);
    border-bottom: 1px solid rgba(0, 255, 102, 0.25);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 100;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #00ff66;
    font-size: 22px;
    font-weight: bold;
}

.logo span {
    font-size: 28px;
}

#fullscreenBtn {
    background: transparent;
    border: 1px solid #00ff66;
    color: #00ff66;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

#fullscreenBtn:hover {
    background: #00ff66;
    color: #000;
}

#gameContainer {
    position: fixed;
    top: 64px;
    left: 0;
    width: 100%;
    height: calc(100vh - 64px);
    height: calc(100dvh - 64px);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
}

#scoreBoard {
    width: min(92vw, 600px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    font-weight: bold;
    z-index: 10;
}

.score {
    color: #00ff66;
}

.best {
    color: #ffffff;
}

canvas {
    display: block;
    background: #080808;
    border: 2px solid rgba(0, 255, 102, 0.45);
    box-shadow:
        0 0 20px rgba(0, 255, 102, 0.08),
        inset 0 0 20px rgba(0, 255, 102, 0.03);
    touch-action: none;
}

.controls {
    color: rgba(255, 255, 255, 0.45);
    font-size: 12px;
    letter-spacing: 1px;
    text-align: center;
}

#gameOver {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(0, 0, 0, 0.78);
    z-index: 50;
}

#gameOver.show {
    display: flex;
}

.gameOverIcon {
    font-size: 55px;
    margin-bottom: 10px;
}

#gameOver h1 {
    color: #ff3030;
    font-size: 38px;
    margin-bottom: 8px;
}

.finalScore {
    color: white;
    font-size: 18px;
    margin-bottom: 22px;
}

#playAgain {
    border: 2px solid #00ff66;
    background: transparent;
    color: #00ff66;
    padding: 12px 25px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#playAgain:hover {
    background: #00ff66;
    color: #000;
}

/* =========================
   NORMAL FULLSCREEN
========================= */

:fullscreen {
    width: 100%;
    height: 100%;
    background: #050505;
}

:fullscreen #navbar {
    display: none;
}

:fullscreen #gameContainer {
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    #navbar {
        height: 55px;
        padding: 0 12px;
    }

    .logo {
        font-size: 19px;
    }

    .logo span {
        font-size: 24px;
    }

    #fullscreenBtn {
        padding: 7px 10px;
        font-size: 12px;
    }

    #gameContainer {
        top: 55px;
        height: calc(100vh - 55px);
        height: calc(100dvh - 55px);
        gap: 5px;
    }

    #scoreBoard {
        width: 92vw;
        font-size: 15px;
    }

    .controls {
        display: none;
    }

    canvas {
        max-width: 100vw;
        max-height: calc(100dvh - 75px);
    }

    :fullscreen #navbar {
        display: none;
    }

    :fullscreen #gameContainer {
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    :fullscreen canvas {
        max-width: 100vw;
        max-height: 100dvh;
    }

    /* Fallback fullscreen for mobile browsers */
    body.mobileFullscreen #navbar {
        display: none;
    }

    body.mobileFullscreen #gameContainer {
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    body.mobileFullscreen canvas {
        max-width: 100vw;
        max-height: 100dvh;
    }
}
</style>
</head>

<body>

<nav id="navbar">
    <div class="logo">
        <span>🐍</span>
        The Snake
    </div>

    <button id="fullscreenBtn">⛶ FULLSCREEN</button>
</nav>

<div id="gameContainer">

    <div id="scoreBoard">
        <div class="score">SCORE: <span id="score">0</span></div>
        <div class="best">BEST: <span id="best">0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls">
        WASD / ARROW KEYS • MOVE
    </div>

    <div id="gameOver">
        <div class="gameOverIcon">💥</div>
        <h1>GAME OVER</h1>

        <div class="finalScore">
            SCORE: <span id="finalScore">0</span>
        </div>

        <button id="playAgain">PLAY AGAIN</button>
    </div>

</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const finalScoreEl = document.getElementById("finalScore");
const gameOverEl = document.getElementById("gameOver");
const playAgainBtn = document.getElementById("playAgain");
const fullscreenBtn = document.getElementById("fullscreenBtn");

const GRID = 24;

let tileSize = 20;

let snake;
let direction;
let nextDirection;

let food;

let score = 0;
let bestScore = Number(localStorage.getItem("snakeBest") || 0);

let gameRunning = false;
let gameOver = false;

let lastTime = 0;
let moveTimer = 0;

let touchStartX = 0;
let touchStartY = 0;

let particles = [];

let obstacles = [];
let obstacleParticles = [];
let obstacleCount = 0;
let obstacleFlash = 0;


/* =========================
   FRUITS
========================= */

const fruits = [
    {
        type: "apple",
        color: "#ff3030",
        glow: "#ff3030"
    },
    {
        type: "orange",
        color: "#ff8c00",
        glow: "#ff8c00"
    },
    {
        type: "lemon",
        color: "#ffe600",
        glow: "#ffe600"
    },
    {
        type: "strawberry",
        color: "#ff1744",
        glow: "#ff1744"
    },
    {
        type: "grape",
        color: "#9b59ff",
        glow: "#9b59ff"
    },
    {
        type: "watermelon",
        color: "#00dd55",
        glow: "#00ff66"
    }
];

let currentFruit;


/* =========================
   SNAKE COLORS
========================= */

const snakeColors = [
    {
        main: "#00ff66",
        body: "#00cc55"
    },
    {
        main: "#00e5ff",
        body: "#00aacc"
    },
    {
        main: "#b000ff",
        body: "#8700cc"
    },
    {
        main: "#ff3cac",
        body: "#d9007f"
    },
    {
        main: "#ff9f00",
        body: "#dd7700"
    },
    {
        main: "#ffe600",
        body: "#d6c000"
    },
    {
        main: "#ff3030",
        body: "#cc2020"
    },
    {
        main: "#ffffff",
        body: "#bbbbbb"
    }
];

let currentSnakeColor;


/* =========================
   RESIZE
========================= */

function resizeCanvas() {

    let width = window.innerWidth;
    let height = window.innerHeight;

    const isMobile =
        window.matchMedia("(max-width: 700px)").matches;

    const isFullscreen =
        !!document.fullscreenElement ||
        document.body.classList.contains("mobileFullscreen");

    if (!isFullscreen) {

        if (isMobile) {
            height -= 55;
        } else {
            height -= 64;
        }

        width -= 8;
        height -= 8;
    }

    const size = Math.min(width, height);

    canvas.width =
        Math.max(
            GRID,
            Math.floor(size / GRID) * GRID
        );

    canvas.height = canvas.width;

    tileSize = canvas.width / GRID;
}


/* =========================
   RANDOM COLOR
========================= */

function randomSnakeColor() {

    let newColor;

    do {

        newColor =
            snakeColors[
                Math.floor(
                    Math.random() *
                    snakeColors.length
                )
            ];

    } while (
        snakeColors.length > 1 &&
        currentSnakeColor &&
        newColor.main === currentSnakeColor.main
    );

    return newColor;
}


/* =========================
   START GAME
========================= */

function startGame() {

    resizeCanvas();

    snake = [
        {
            x: 12,
            y: 12
        },
        {
            x: 11,
            y: 12
        },
        {
            x: 10,
            y: 12
        }
    ];

    direction = {
        x: 1,
        y: 0
    };

    nextDirection = {
        x: 1,
        y: 0
    };

    score = 0;

    currentSnakeColor =
        snakeColors[0];

    obstacles = [];
    obstacleParticles = [];
    obstacleCount = 0;
    obstacleFlash = 0;

    particles = [];

    scoreEl.textContent = score;
    bestEl.textContent = bestScore;

    gameOverEl.classList.remove("show");

    gameOver = false;
    gameRunning = true;

    spawnFood();

    lastTime = performance.now();
    moveTimer = 0;

    requestAnimationFrame(gameLoop);
}


/* =========================
   FOOD
========================= */

function spawnFood() {

    let valid = false;

    while (!valid) {

        food = {
            x:
                Math.floor(
                    Math.random() *
                    (GRID - 4)
                ) + 2,

            y:
                Math.floor(
                    Math.random() *
                    (GRID - 4)
                ) + 2
        };

        valid =
            !snake.some(
                segment =>
                    segment.x === food.x &&
                    segment.y === food.y
            ) &&
            !obstacles.some(
                obstacle =>
                    obstacle.x === food.x &&
                    obstacle.y === food.y
            );
    }

    let newFruit;

    do {

        newFruit =
            fruits[
                Math.floor(
                    Math.random() *
                    fruits.length
                )
            ];

    } while (
        fruits.length > 1 &&
        currentFruit &&
        newFruit.type === currentFruit.type
    );

    currentFruit = newFruit;
}


/* =========================
   OBSTACLES
========================= */

function shouldAddObstacle() {

    return (
        score >= 4 &&
        score % 4 === 0 &&
        obstacles.length < 14
    );
}


function addObstacle() {

    let attempts = 0;

    while (attempts < 300) {

        attempts++;

        const obstacle = {
            x:
                Math.floor(
                    Math.random() *
                    (GRID - 4)
                ) + 2,

            y:
                Math.floor(
                    Math.random() *
                    (GRID - 4)
                ) + 2,

            size: 0.2,
            rotation: Math.random() * Math.PI * 2
        };

        const tooCloseToSnake =
            snake.some(segment => {

                const dx =
                    Math.abs(
                        segment.x -
                        obstacle.x
                    );

                const dy =
                    Math.abs(
                        segment.y -
                        obstacle.y
                    );

                return dx <= 2 && dy <= 2;
            });

        const onFood =
            food &&
            food.x === obstacle.x &&
            food.y === obstacle.y;

        const onOtherObstacle =
            obstacles.some(
                other =>
                    other.x === obstacle.x &&
                    other.y === obstacle.y
            );

        if (
            !tooCloseToSnake &&
            !onFood &&
            !onOtherObstacle
        ) {

            obstacles.push(obstacle);

            createObstacleSpawnParticles(
                obstacle
            );

            break;
        }
    }
}


/* =========================
   OBSTACLE PARTICLES
========================= */

function createObstacleSpawnParticles(obstacle) {

    for (let i = 0; i < 18; i++) {

        obstacleParticles.push({

            x:
                (obstacle.x + 0.5) *
                tileSize,

            y:
                (obstacle.y + 0.5) *
                tileSize,

            vx:
                (Math.random() - 0.5) *
                5,

            vy:
                (Math.random() - 0.5) *
                5,

            life: 1,

            size:
                Math.random() * 3 + 1,

            color:
                Math.random() > 0.5
                    ? "#ff8c00"
                    : "#ff3030"
        });
    }
}


function createObstacleExplosion(obstacle) {

    obstacleFlash = 1;

    for (let i = 0; i < 45; i++) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            Math.random() * 8 + 2;

        obstacleParticles.push({

            x:
                (obstacle.x + 0.5) *
                tileSize,

            y:
                (obstacle.y + 0.5) *
                tileSize,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life: 1,

            size:
                Math.random() * 5 + 2,

            color:
                Math.random() > 0.5
                    ? "#ff3030"
                    : "#ff8c00"
        });
    }
}


/* =========================
   DRAW BACKGROUND
========================= */

function drawBackground() {

    ctx.fillStyle = "#080808";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.strokeStyle =
        "rgba(0,255,102,0.035)";

    ctx.lineWidth = 1;

    for (let i = 0; i <= GRID; i++) {

        const p =
            i * tileSize;

        ctx.beginPath();

        ctx.moveTo(p, 0);
        ctx.lineTo(
            p,
            canvas.height
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(0, p);
        ctx.lineTo(
            canvas.width,
            p
        );

        ctx.stroke();
    }
}


/* =========================
   DRAW FOOD
========================= */

function drawFood() {

    if (!food || !currentFruit) return;

    const x =
        food.x * tileSize +
        tileSize / 2;

    const y =
        food.y * tileSize +
        tileSize / 2;

    const r =
        tileSize * 0.30;

    ctx.save();

    ctx.shadowColor =
        currentFruit.glow;

    ctx.shadowBlur = 18;

    ctx.fillStyle =
        currentFruit.color;

    if (currentFruit.type === "apple") {

        ctx.beginPath();

        ctx.arc(
            x - r * 0.35,
            y,
            r,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + r * 0.35,
            y,
            r,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillRect(
            x - 1,
            y - r - 4,
            2,
            6
        );

        ctx.fillStyle = "#00aa44";

        ctx.beginPath();

        ctx.ellipse(
            x + 5,
            y - r - 1,
            5,
            3,
            -0.5,
            0,
            Math.PI * 2
        );

        ctx.fill();

    } else if (currentFruit.type === "orange") {

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            r,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.strokeStyle =
            "rgba(255,255,255,0.25)";

        ctx.lineWidth = 1;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            r * 0.65,
            0,
            Math.PI * 2
        );

        ctx.stroke();

    } else if (currentFruit.type === "lemon") {

        ctx.beginPath();

        ctx.ellipse(
            x,
            y,
            r * 0.8,
            r * 1.15,
            -0.4,
            0,
            Math.PI * 2
        );

        ctx.fill();

    } else if (
        currentFruit.type === "strawberry"
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            y + r
        );

        ctx.bezierCurveTo(
            x - r * 1.4,
            y,
            x - r * 0.9,
            y - r,
            x,
            y - r * 0.55
        );

        ctx.bezierCurveTo(
            x + r * 0.9,
            y - r,
            x + r * 1.4,
            y,
            x,
            y + r
        );

        ctx.fill();

        ctx.fillStyle = "#00aa44";

        ctx.beginPath();

        ctx.arc(
            x,
            y - r * 0.6,
            r * 0.3,
            0,
            Math.PI * 2
        );

        ctx.fill();

    } else if (
        currentFruit.type === "grape"
    ) {

        const dots = [
            [-0.35, -0.4],
            [0.35, -0.4],
            [-0.55, 0.1],
            [0, 0.1],
            [0.55, 0.1],
            [-0.3, 0.55],
            [0.3, 0.55]
        ];

        dots.forEach(([dx, dy]) => {

            ctx.beginPath();

            ctx.arc(
                x + dx * r,
                y + dy * r,
                r * 0.42,
                0,
                Math.PI * 2
            );

            ctx.fill();
        });

    } else if (
        currentFruit.type === "watermelon"
    ) {

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            r,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle =
            "#073d1d";

        ctx.fillRect(
            x - 2,
            y - r * 0.7,
            4,
            r * 1.4
        );
    }

    ctx.restore();
}


/* =========================
   DRAW OBSTACLES
========================= */

function drawObstacles() {

    obstacles.forEach(obstacle => {

        obstacle.size +=
            (1 - obstacle.size) * 0.12;

        const x =
            (obstacle.x + 0.5) *
            tileSize;

        const y =
            (obstacle.y + 0.5) *
            tileSize;

        const size =
            tileSize *
            0.72 *
            obstacle.size;

        ctx.save();

        ctx.translate(x, y);

        ctx.rotate(
            obstacle.rotation
        );

        ctx.shadowColor =
            "#ff3030";

        ctx.shadowBlur = 15;

        ctx.fillStyle =
            "#521010";

        ctx.strokeStyle =
            "#ff4a30";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.moveTo(
            -size * 0.55,
            -size * 0.35
        );

        ctx.lineTo(
            -size * 0.15,
            -size * 0.65
        );

        ctx.lineTo(
            size * 0.55,
            -size * 0.35
        );

        ctx.lineTo(
            size * 0.45,
            size * 0.45
        );

        ctx.lineTo(
            -size * 0.45,
            size * 0.5
        );

        ctx.closePath();

        ctx.fill();
        ctx.stroke();

        ctx.restore();
    });
}


/* =========================
   DRAW SNAKE
========================= */

function drawSnake() {

    snake.forEach(
        (segment, index) => {

            const x =
                segment.x * tileSize;

            const y =
                segment.y * tileSize;

            const padding =
                tileSize * 0.08;

            ctx.save();

            ctx.shadowColor =
                currentSnakeColor.main;

            ctx.shadowBlur =
                index === 0 ? 18 : 10;

            ctx.fillStyle =
                index === 0
                    ? currentSnakeColor.main
                    : currentSnakeColor.body;

            ctx.beginPath();

            const radius =
                tileSize * 0.18;

            ctx.roundRect(
                x + padding,
                y + padding,
                tileSize - padding * 2,
                tileSize - padding * 2,
                radius
            );

            ctx.fill();

            if (index === 0) {

                ctx.fillStyle =
                    "#050505";

                const eyeSize =
                    tileSize * 0.09;

                let eye1X;
                let eye1Y;
                let eye2X;
                let eye2Y;

                if (direction.x !== 0) {

                    eye1X =
                        x +
                        tileSize *
                        (direction.x > 0
                            ? 0.68
                            : 0.32);

                    eye2X = eye1X;

                    eye1Y =
                        y +
                        tileSize *
                        0.35;

                    eye2Y =
                        y +
                        tileSize *
                        0.65;

                } else {

                    eye1Y =
                        y +
                        tileSize *
                        (direction.y > 0
                            ? 0.68
                            : 0.32);

                    eye2Y = eye1Y;

                    eye1X =
                        x +
                        tileSize *
                        0.35;

                    eye2X =
                        x +
                        tileSize *
                        0.65;
                }

                ctx.beginPath();

                ctx.arc(
                    eye1X,
                    eye1Y,
                    eyeSize,
                    0,
                    Math.PI * 2
                );

                ctx.arc(
                    eye2X,
                    eye2Y,
                    eyeSize,
                    0,
                    Math.PI * 2
                );

                ctx.fill();
            }

            ctx.restore();
        }
    );
}


/* =========================
   FOOD PARTICLES
========================= */

function createFoodParticles() {

    const centerX =
        food.x * tileSize +
        tileSize / 2;

    const centerY =
        food.y * tileSize +
        tileSize / 2;

    for (let i = 0; i < 25; i++) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            Math.random() * 5 + 1;

        particles.push({

            x: centerX,
            y: centerY,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life: 1,

            size:
                Math.random() * 4 + 1,

            color:
                currentFruit.color
        });
    }
}


/* =========================
   DEATH PARTICLES
========================= */

function createDeathExplosion() {

    const head = snake[0];

    const centerX =
        head.x * tileSize +
        tileSize / 2;

    const centerY =
        head.y * tileSize +
        tileSize / 2;

    for (let i = 0; i < 55; i++) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            Math.random() * 9 + 2;

        particles.push({

            x: centerX,
            y: centerY,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life: 1,

            size:
                Math.random() * 5 + 2,

            color:
                Math.random() > 0.5
                    ? currentSnakeColor.main
                    : "#ff3030"
        });
    }
}


/* =========================
   DRAW PARTICLES
========================= */

function drawParticles() {

    particles.forEach(p => {

        ctx.save();

        ctx.globalAlpha =
            Math.max(0, p.life);

        ctx.fillStyle =
            p.color;

        ctx.shadowColor =
            p.color;

        ctx.shadowBlur = 10;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    });

    obstacleParticles.forEach(p => {

        ctx.save();

        ctx.globalAlpha =
            Math.max(0, p.life);

        ctx.fillStyle =
            p.color;

        ctx.shadowColor =
            p.color;

        ctx.shadowBlur = 10;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    });
}


/* =========================
   UPDATE PARTICLES
========================= */

function updateParticles() {

    particles.forEach(p => {

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= 0.96;
        p.vy *= 0.96;

        p.life -= 0.035;

        p.size *= 0.98;
    });

    particles =
        particles.filter(
            p => p.life > 0
        );


    obstacleParticles.forEach(p => {

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= 0.95;
        p.vy *= 0.95;

        p.life -= 0.035;

        p.size *= 0.98;
    });

    obstacleParticles =
        obstacleParticles.filter(
            p => p.life > 0
        );

    obstacleFlash *= 0.9;
}


/* =========================
   MOVE SNAKE
========================= */

function update() {

    direction = {
        x: nextDirection.x,
        y: nextDirection.y
    };

    const head = {
        x: snake[0].x +
            direction.x,

        y: snake[0].y +
            direction.y
    };


    /* WALL */

    if (
        head.x < 0 ||
        head.x >= GRID ||
        head.y < 0 ||
        head.y >= GRID
    ) {

        die();

        return;
    }


    /* OBSTACLE */

    const hitObstacle =
        obstacles.find(
            obstacle =>
                obstacle.x === head.x &&
                obstacle.y === head.y
        );

    if (hitObstacle) {

        createObstacleExplosion(
            hitObstacle
        );

        obstacles =
            obstacles.filter(
                obstacle =>
                    obstacle !== hitObstacle
            );

        die();

        return;
    }


    /* BODY */

    const hitBody =
        snake.some(
            segment =>
                segment.x === head.x &&
                segment.y === head.y
        );

    if (hitBody) {

        die();

        return;
    }


    snake.unshift(head);


    /* FOOD */

    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score++;

        scoreEl.textContent =
            score;


        if (score > bestScore) {

            bestScore = score;

            localStorage.setItem(
                "snakeBest",
                bestScore
            );

            bestEl.textContent =
                bestScore;
        }


        createFoodParticles();


        /* CHANGE SNAKE COLOR */

        currentSnakeColor =
            randomSnakeColor();


        /* ADD OBSTACLE */

        if (shouldAddObstacle()) {

            addObstacle();
        }


        spawnFood();

    } else {

        snake.pop();
    }
}


/* =========================
   DIE
========================= */

function die() {

    if (gameOver) return;

    gameRunning = false;
    gameOver = true;

    createDeathExplosion();

    finalScoreEl.textContent =
        score;

    setTimeout(() => {

        gameOverEl.classList.add(
            "show"
        );

    }, 450);
}


/* =========================
   DRAW
========================= */

function draw() {

    drawBackground();

    drawObstacles();

    drawFood();

    drawSnake();

    drawParticles();


    if (obstacleFlash > 0.02) {

        ctx.save();

        ctx.fillStyle =
            `rgba(255,60,20,${obstacleFlash * 0.18})`;

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.restore();
    }
}


/* =========================
   GAME LOOP
========================= */

function gameLoop(timestamp) {

    const delta =
        timestamp - lastTime;

    lastTime = timestamp;

    moveTimer += delta;

    const speed =
        Math.max(
            65,
            125 - score * 2
        );

    if (
        gameRunning &&
        moveTimer >= speed
    ) {

        moveTimer = 0;

        update();
    }

    updateParticles();

    draw();


    if (
        gameRunning ||
        particles.length > 0 ||
        obstacleParticles.length > 0 ||
        obstacleFlash > 0.02
    ) {

        requestAnimationFrame(
            gameLoop
        );
    }
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    e => {

        const key =
            e.key.toLowerCase();

        if (
            key === "w" ||
            key === "arrowup"
        ) {

            if (direction.y === 0) {

                nextDirection = {
                    x: 0,
                    y: -1
                };
            }

        } else if (
            key === "s" ||
            key === "arrowdown"
        ) {

            if (direction.y === 0) {

                nextDirection = {
                    x: 0,
                    y: 1
                };
            }

        } else if (
            key === "a" ||
            key === "arrowleft"
        ) {

            if (direction.x === 0) {

                nextDirection = {
                    x: -1,
                    y: 0
                };
            }

        } else if (
            key === "d" ||
            key === "arrowright"
        ) {

            if (direction.x === 0) {

                nextDirection = {
                    x: 1,
                    y: 0
                };
            }
        }
    }
);


/* =========================
   TOUCH CONTROLS
========================= */

canvas.addEventListener(
    "touchstart",
    e => {

        const touch =
            e.touches[0];

        touchStartX =
            touch.clientX;

        touchStartY =
            touch.clientY;

    },
    {
        passive: true
    }
);


canvas.addEventListener(
    "touchend",
    e => {

        const touch =
            e.changedTouches[0];

        const dx =
            touch.clientX -
            touchStartX;

        const dy =
            touch.clientY -
            touchStartY;

        const absX =
            Math.abs(dx);

        const absY =
            Math.abs(dy);

        if (
            Math.max(absX, absY) < 20
        ) {
            return;
        }

        if (absX > absY) {

            if (dx > 0) {

                if (direction.x === 0) {

                    nextDirection = {
                        x: 1,
                        y: 0
                    };
                }

            } else {

                if (direction.x === 0) {

                    nextDirection = {
                        x: -1,
                        y: 0
                    };
                }
            }

        } else {

            if (dy > 0) {

                if (direction.y === 0) {

                    nextDirection = {
                        x: 0,
                        y: 1
                    };
                }

            } else {

                if (direction.y === 0) {

                    nextDirection = {
                        x: 0,
                        y: -1
                    };
                }
            }
        }
    },
    {
        passive: true
    }
);


/* =========================
   FULLSCREEN
========================= */

async function toggleFullscreen() {

    try {

        if (!document.fullscreenElement) {

            if (
                document.documentElement.requestFullscreen
            ) {

                await document.documentElement
                    .requestFullscreen();

            } else {

                /* Mobile fallback */

                document.body.classList.add(
                    "mobileFullscreen"
                );
            }

        } else {

            await document.exitFullscreen();
        }

    } catch (error) {

        /*
         * Some mobile browsers don't allow
         * the Fullscreen API.
         * Use the CSS fullscreen fallback.
         */

        document.body.classList.add(
            "mobileFullscreen"
        );
    }


    setTimeout(() => {

        resizeCanvas();

        if (snake && food) {

            draw();
        }

    }, 200);
}


/* =========================
   FULLSCREEN CHANGE
========================= */

document.addEventListener(
    "fullscreenchange",
    () => {

        if (!document.fullscreenElement) {

            document.body.classList.remove(
                "mobileFullscreen"
            );
        }

        setTimeout(() => {

            resizeCanvas();

            if (snake && food) {

                draw();
            }

        }, 100);
    }
);


/* =========================
   PLAY AGAIN
========================= */

playAgainBtn.addEventListener(
    "click",
    () => {

        startGame();
    }
);


/* =========================
   FULLSCREEN BUTTON
========================= */

fullscreenBtn.addEventListener(
    "click",
    () => {

        toggleFullscreen();
    }
);


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    () => {

        resizeCanvas();

        if (snake && food) {

            draw();
        }
    }
);


/* =========================
   START
========================= */

resizeCanvas();

bestEl.textContent =
    bestScore;

startGame();

</script>
