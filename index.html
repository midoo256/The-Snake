<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
>

<title>The Snake</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #050505;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    touch-action: none;
}


/* =================================
   NAVBAR
   ================================= */

#navbar {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    height: 64px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 22px;

    z-index: 100;

    background:
        rgba(5, 5, 5, 0.88);

    backdrop-filter: blur(10px);

    border-bottom:
        1px solid #202020;
}


/* LOGO */

.logo {

    display: flex;

    align-items: center;

    gap: 10px;

    font-size: 21px;

    font-weight: 900;

    letter-spacing: 1px;

    color: white;
}


.logoIcon {

    width: 36px;
    height: 36px;

    border-radius: 10px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 23px;

    background: #101010;

    border: 1px solid #333;

    box-shadow:
        0 0 15px
        rgba(0,255,100,0.15);
}


.logo span {

    color: #00ff66;

    text-shadow:
        0 0 12px
        rgba(0,255,100,0.7);
}


/* FULLSCREEN BUTTON */

#fullscreenBtn {

    border: 1px solid #333;

    background: #111;

    color: #aaa;

    border-radius: 9px;

    padding: 9px 13px;

    cursor: pointer;

    font-size: 15px;

    transition: 0.2s;
}


#fullscreenBtn:hover {

    color: #00ff66;

    border-color: #00ff66;
}


/* =================================
   GAME CONTAINER
   ================================= */

#gameContainer {

    position: fixed;

    top: 64px;
    left: 0;

    width: 100vw;

    height:
        calc(100vh - 64px);

    height:
        calc(100dvh - 64px);

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            #101010 0%,
            #050505 70%
        );
}


/* =================================
   SCORE
   ================================= */

#topBar {

    position: absolute;

    top: 15px;

    left: 0;

    width: 100%;

    display: flex;

    justify-content:
        space-between;

    padding: 0 25px;

    z-index: 10;

    pointer-events: none;
}


.scoreBox {

    background:
        rgba(12,12,12,0.9);

    border:
        1px solid #292929;

    border-radius: 12px;

    padding:
        7px 17px;

    min-width: 90px;

    box-shadow:
        0 0 20px
        rgba(0,255,100,0.05);
}


.label {

    font-size: 9px;

    color: #666;

    letter-spacing: 2px;

    text-transform: uppercase;
}


.value {

    margin-top: 2px;

    font-size: 22px;

    font-weight: bold;

    color: #00ff66;

    text-shadow:
        0 0 10px
        rgba(0,255,100,0.7);
}


.best {

    color: #ffd700;

    text-shadow:
        0 0 10px
        rgba(255,215,0,0.6);
}


/* =================================
   CANVAS
   ================================= */

canvas {

    display: block;

    background: #090909;

    border:
        2px solid #242424;

    box-shadow:
        0 0 50px
        rgba(0,255,100,0.08);

    max-width: 100%;
    max-height: 100%;
}


/* =================================
   DESKTOP CONTROLS
   ================================= */

#controls {

    position: absolute;

    bottom: 12px;

    left: 50%;

    transform:
        translateX(-50%);

    color: #555;

    font-size: 11px;

    letter-spacing: 1px;

    white-space: nowrap;
}


/* =================================
   FEEDBACK TEXT
   ================================= */

#feedbackText {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0.4);
    z-index: 80;
    pointer-events: none;
    opacity: 0;
    font-size: clamp(24px, 5vw, 54px);
    font-weight: 900;
    font-style: italic;
    letter-spacing: 2px;
    color: #00ff66;
    text-shadow:
        0 0 8px currentColor,
        0 0 24px currentColor,
        0 0 45px rgba(255,255,255,0.25);
    white-space: nowrap;
    will-change: transform, opacity;
}

#feedbackText.show {
    animation: feedbackPop 0.72s cubic-bezier(.16,1.35,.35,1) forwards;
}

@keyframes feedbackPop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.35) rotate(-8deg); }
    18% { opacity: 1; transform: translate(-50%, -50%) scale(1.18) rotate(3deg); }
    42% { transform: translate(-50%, -50%) scale(0.96) rotate(-2deg); }
    68% { opacity: 1; transform: translate(-50%, -62%) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translate(-50%, -82%) scale(0.9) rotate(0deg); }
}

/* =================================
   GAME OVER
   ================================= */

#gameOver {

    position: absolute;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 200;

    background:
        radial-gradient(
            circle,
            rgba(70,0,0,0.3),
            rgba(0,0,0,0.94)
        );

    backdrop-filter: blur(8px);
}


.gameOverBox {

    width: min(500px, 88vw);

    padding: 45px 30px;

    text-align: center;

    border:
        1px solid
        rgba(255,50,50,0.35);

    border-radius: 25px;

    background:
        rgba(10,10,10,0.92);

    box-shadow:
        0 0 60px
        rgba(255,0,0,0.12);

    animation:
        gameOverIn 0.55s
        cubic-bezier(.2,.8,.2,1);
}


@keyframes gameOverIn {

    from {

        opacity: 0;

        transform:
            scale(0.6)
            translateY(40px);
    }

    to {

        opacity: 1;

        transform:
            scale(1)
            translateY(0);
    }
}


.gameOverIcon {

    font-size: 55px;

    margin-bottom: 10px;

    animation:
        floatIcon 1.5s
        infinite
        alternate;
}


@keyframes floatIcon {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-8px);
    }
}


.gameOverTitle {

    font-size: 58px;

    font-weight: 900;

    letter-spacing: 4px;

    color: #ff3030;

    text-shadow:
        0 0 10px #ff3030,
        0 0 30px rgba(255,0,0,0.7),
        0 0 60px rgba(255,0,0,0.3);
}


.finalScore {

    margin-top: 15px;

    color: #777;

    font-size: 13px;

    letter-spacing: 3px;
}


.finalScore span {

    display: block;

    margin-top: 5px;

    color: white;

    font-size: 38px;

    font-weight: bold;

    letter-spacing: 1px;
}


.playAgain {

    margin-top: 30px;

    padding: 14px 38px;

    border: none;

    border-radius: 12px;

    background: #00dd55;

    color: #031108;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 0 20px
        rgba(0,255,100,0.25);

    transition: 0.2s;
}


.playAgain:hover {

    transform: scale(1.07);

    background: #00ff66;

    box-shadow:
        0 0 35px
        rgba(0,255,100,0.5);
}


/* =================================
   FULLSCREEN MODE
   ================================= */

:fullscreen #navbar {

    height: 64px;
}


:fullscreen #gameContainer {

    top: 64px;

    width: 100vw;

    height: calc(100vh - 64px);

    height: calc(100dvh - 64px);
}


/* =================================
   MOBILE
   ================================= */

@media (max-width: 700px) {

    #navbar {

        height: 55px;

        padding: 0 13px;
    }


    #gameContainer {

        top: 55px;

        height:
            calc(100vh - 55px);

        height:
            calc(100dvh - 55px);
    }


    .logo {

        font-size: 18px;
    }


    .logoIcon {

        width: 32px;
        height: 32px;

        font-size: 20px;
    }


    #fullscreenBtn {

        padding: 7px 10px;

        font-size: 13px;
    }


    #topBar {

        top: 10px;

        padding: 0 10px;
    }


    .scoreBox {

        min-width: 70px;

        padding: 5px 10px;
    }


    .value {

        font-size: 18px;
    }


    #controls {

        display: none;
    }


    .gameOverBox {

        padding: 35px 20px;
    }


    .gameOverTitle {

        font-size: 40px;

        letter-spacing: 2px;
    }


    .gameOverIcon {

        font-size: 45px;
    }
}


/* =================================
   MOBILE FULLSCREEN
   ================================= */

@media (max-width: 700px) {

    :fullscreen #navbar {

        height: 55px;
    }


    :fullscreen #gameContainer {

        top: 55px;

        height: calc(100vh - 55px);

        height: calc(100dvh - 55px);
    }
}


</style>

</head>


<body>


<!-- =================================
     NAVBAR
     ================================= -->

<nav id="navbar">

    <div class="logo">

        <div class="logoIcon">
            🐍
        </div>

        <div>
            The <span>Snake</span>
        </div>

    </div>


    <button
        id="fullscreenBtn"
        onclick="toggleFullscreen()"
    >
        ⛶ Fullscreen
    </button>

</nav>



<!-- =================================
     GAME
     ================================= -->

<div id="gameContainer">


    <!-- SCORE -->

    <div id="topBar">

        <div class="scoreBox">

            <div class="label">
                Score
            </div>

            <div
                class="value"
                id="score"
            >
                0
            </div>

        </div>


        <div class="scoreBox">

            <div class="label">
                Best
            </div>

            <div
                class="value best"
                id="highScore"
            >
                0
            </div>

        </div>

    </div>



    <!-- FEEDBACK TEXT -->
    <div id="feedbackText"></div>

    <!-- GAME CANVAS -->
    <canvas id="game"></canvas>



    <!-- DESKTOP -->

    <div id="controls">

        WASD / ARROW KEYS • MOVE

    </div>



    <!-- GAME OVER -->

    <div id="gameOver">

        <div class="gameOverBox">

            <div class="gameOverIcon">
                💥
            </div>

            <div class="gameOverTitle">
                GAME OVER
            </div>

            <div class="finalScore">

                FINAL SCORE

                <span id="finalScore">
                    0
                </span>

            </div>

            <button
                class="playAgain"
                onclick="restartGame()"
            >
                PLAY AGAIN
            </button>

        </div>

    </div>

</div>



<script>


/* =================================
   CANVAS
   ================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext(
        "2d",
        {
            alpha: false,
            desynchronized: true
        }
    );

ctx.imageSmoothingEnabled = false;


/* =================================
   UI
   ================================= */

const scoreElement =
    document.getElementById("score");

const highScoreElement =
    document.getElementById("highScore");

const gameOver =
    document.getElementById("gameOver");

const finalScore =
    document.getElementById("finalScore");

const feedbackText =
    document.getElementById("feedbackText");


/* =================================
   GAME SETTINGS
   ================================= */

const GRID = 32;

let tileSize;

let backgroundCache = null;
let backgroundCacheSize = 0;

let snake;

let food;

let direction;

let nextDirection;

let score = 0;

let highScore =
    Number(
        localStorage.getItem(
            "theSnakeHighScore"
        )
    ) || 0;

let gameRunning = false;

let gameSpeed = 115;

let lastTime = 0;

let gameAccumulator = 0;

// Mobile performance optimization
const isMobileDevice = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
const maxParticles = isMobileDevice ? 70 : 140;
const maxFoodParticles = isMobileDevice ? 24 : 50;
const maxObstacleParticles = isMobileDevice ? 32 : 70;
let lastParticleTime = performance.now();


let animationFrameId = null;

let audioContext = null;
let audioMaster = null;
let feedbackTimer = null;

function initAudio() {
    if (!audioContext) {
        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioCtx)
            return;

        audioContext = new AudioCtx();
        audioMaster =
            audioContext.createGain();

        audioMaster.gain.value = 0.16;
        audioMaster.connect(
            audioContext.destination
        );
    }

    if (
        audioContext &&
        audioContext.state === "suspended"
    ) {
        audioContext.resume();
    }
}

function tone(
    frequency,
    duration,
    type = "square",
    volume = 0.08,
    slideTo = null
) {
    initAudio();

    if (!audioContext || !audioMaster)
        return;

    const now =
        audioContext.currentTime;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(
        frequency,
        now
    );

    if (slideTo !== null) {
        oscillator.frequency.exponentialRampToValueAtTime(
            Math.max(25, slideTo),
            now + duration
        );
    }

    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        now + 0.008
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );

    oscillator.connect(gain);
    gain.connect(audioMaster);

    oscillator.start(now);
    oscillator.stop(
        now + duration + 0.015
    );
}

function playExplosionSound() {
    initAudio();

    if (!audioContext)
        return;

    tone(
        110,
        0.28,
        "sawtooth",
        0.20,
        38
    );

    tone(
        65,
        0.18,
        "triangle",
        0.13,
        32
    );
}

function playLoseSound() {

    initAudio();

    if (
        !audioContext ||
        !audioMaster
    )
        return;

    /*
       Original retro platform-game
       lose sound. It has the same
       kind of short descending feel
       as classic games, but is not
       a copy of Mario's audio.
    */

    const notes = [
        {
            frequency: 392,
            duration: 0.12,
            delay: 0
        },
        {
            frequency: 330,
            duration: 0.12,
            delay: 0.12
        },
        {
            frequency: 262,
            duration: 0.16,
            delay: 0.24
        },
        {
            frequency: 196,
            duration: 0.28,
            delay: 0.40
        }
    ];

    notes.forEach(note => {

        setTimeout(
            () => {

                tone(
                    note.frequency,
                    note.duration,
                    "square",
                    0.09,
                    note.frequency * 0.92
                );

            },
            note.delay * 1000
        );

    });
}

const eatSoundPatterns = [
    [660, 880],
    [523, 784],
    [740, 988],
    [587, 880],
    [698, 1047],
    [494, 740],
    [622, 932],
    [784, 1175]
];

let eatSoundIndex = 0;

function playEatSound() {
    const pattern =
        eatSoundPatterns[
            eatSoundIndex %
            eatSoundPatterns.length
        ];

    eatSoundIndex++;

    tone(
        pattern[0],
        0.075,
        "square",
        0.055,
        pattern[1]
    );

    setTimeout(
        () =>
            tone(
                pattern[1],
                0.11,
                "triangle",
                0.05
            ),
        58
    );
}

const feedbackWords = [
    "AMAZING!",
    "AWESOME!",
    "NICE!",
    "YUMMY!",
    "GREAT!",
    "DELICIOUS!",
    "WOW!",
    "PERFECT!"
];

let feedbackIndex = 0;

function showFeedback() {
    const word =
        feedbackWords[
            feedbackIndex %
            feedbackWords.length
        ];

    feedbackIndex++;

    feedbackText.textContent = word;
    feedbackText.style.color =
        currentFruit.color;

    feedbackText.classList.remove("show");

    void feedbackText.offsetWidth;

    feedbackText.classList.add("show");

    if (feedbackTimer)
        clearTimeout(feedbackTimer);

    feedbackTimer =
        setTimeout(
            () => {
                feedbackText.classList.remove("show");
            },
            760
        );
}


/* =================================
   FRUITS
   ================================= */

const fruits = [

    {
        type: "apple",
        color: "#ff3030",
        glow: "#ff3030"
    },

    {
        type: "orange",
        color: "#ff8c00",
        glow: "#ff8c00"
    },

    {
        type: "lemon",
        color: "#ffe600",
        glow: "#ffe600"
    },

    {
        type: "strawberry",
        color: "#ff1744",
        glow: "#ff1744"
    },

    {
        type: "grape",
        color: "#9b59ff",
        glow: "#9b59ff"
    },

    {
        type: "watermelon",
        color: "#00dd55",
        glow: "#00ff66"
    }

];


let currentFruit;


/* =================================
   SNAKE COLORS
   ================================= */

const snakeColors = [

    {
        main: "#00ff66",
        body: "#00cc55"
    },

    {
        main: "#00e5ff",
        body: "#00aacc"
    },

    {
        main: "#b000ff",
        body: "#8700cc"
    },

    {
        main: "#ff3cac",
        body: "#d9007f"
    },

    {
        main: "#ff9f00",
        body: "#dd7700"
    },

    {
        main: "#ffe600",
        body: "#d6c000"
    },

    {
        main: "#ff3030",
        body: "#cc2020"
    },

    {
        main: "#ffffff",
        body: "#bbbbbb"
    }

];


let currentSnakeColor;


/* =================================
   OBSTACLES
   ================================= */

let obstacles = [];

let obstacleParticles = [];

let obstacleCount = 0;

let obstacleFlash = 0;


/* =================================
   AUDIO UNLOCK
   ================================= */

document.addEventListener(
    "pointerdown",
    initAudio,
    { passive: true }
);

document.addEventListener(
    "keydown",
    initAudio,
    { passive: true }
);


/* =================================
   TOUCH SWIPE
   ================================= */

let touchStartX = 0;

let touchStartY = 0;


document.addEventListener(
    "touchstart",
    event => {

        if (
            event.touches.length !== 1
        ) {
            return;
        }


        touchStartX =
            event.touches[0].clientX;

        touchStartY =
            event.touches[0].clientY;
    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchend",
    event => {

        if (
            event.changedTouches.length !== 1
        ) {
            return;
        }


        const touch =
            event.changedTouches[0];


        const deltaX =
            touch.clientX -
            touchStartX;

        const deltaY =
            touch.clientY -
            touchStartY;


        const minSwipeDistance = 25;


        if (

            Math.abs(deltaX) <
            minSwipeDistance &&

            Math.abs(deltaY) <
            minSwipeDistance

        ) {

            return;
        }


        if (
            Math.abs(deltaX) >
            Math.abs(deltaY)
        ) {

            if (deltaX > 0) {

                setDirection(
                    1,
                    0
                );

            } else {

                setDirection(
                    -1,
                    0
                );
            }

        } else {

            if (deltaY > 0) {

                setDirection(
                    0,
                    1
                );

            } else {

                setDirection(
                    0,
                    -1
                );
            }
        }
    },
    {
        passive: true
    }
);


/* =================================
   EFFECTS
   ================================= */

let particles = [];

let foodParticles = [];

let eatColorEffect = 0;

let foodPulse = 0;

let deathAnimation = false;

let deathTimer = 0;

let screenShake = 0;

let redFlash = 0;

let gameOverReady = false;


/* =================================
   SCORE
   ================================= */

highScoreElement.textContent =
    highScore;


/* =================================
   RESIZE
   ================================= */

function resizeCanvas() {

    let width =
        window.innerWidth - 8;

    let height =
        window.innerHeight - 8;


    if (
        window.matchMedia(
            "(max-width: 700px)"
        ).matches
    ) {

        const navbarHeight =
            document.fullscreenElement
                ? 55
                : 55;

        height =
            window.innerHeight -
            navbarHeight -
            8;
    }


    const size =
        Math.min(
            width,
            height
        );


    canvas.width =
        Math.max(
            GRID,
            Math.floor(
                size / GRID
            ) * GRID
        );


    canvas.height =
        canvas.width;


    tileSize =
        canvas.width / GRID;

    backgroundCache = null;
    backgroundCacheSize = 0;
}


/* =================================
   START GAME
   ================================= */

function startGame() {

    if (
        animationFrameId !== null
    ) {

        cancelAnimationFrame(
            animationFrameId
        );

        animationFrameId = null;
    }


    snake = [

        {
            x: 16,
            y: 16
        },

        {
            x: 15,
            y: 16
        },

        {
            x: 14,
            y: 16
        },

        {
            x: 13,
            y: 16
        }
    ];


    direction = {
        x: 1,
        y: 0
    };


    nextDirection = {
        x: 1,
        y: 0
    };


    score = 0;

    gameSpeed = 115;

    gameRunning = true;

    lastTime =
        performance.now();

    gameAccumulator = 0;


    particles = [];

    foodParticles = [];

    obstacleParticles = [];

    obstacles = [];

    obstacleCount = 0;

    obstacleFlash = 0;

    eatColorEffect = 0;

    foodPulse = 0;

    deathAnimation = false;

    deathTimer = 0;

    screenShake = 0;

    redFlash = 0;

    gameOverReady = false;

    feedbackText.classList.remove("show");
    feedbackText.textContent = "";


    currentSnakeColor =
        snakeColors[0];


    currentFruit =
        fruits[
            Math.floor(
                Math.random() *
                fruits.length
            )
        ];


    scoreElement.textContent =
        score;


    gameOver.style.display =
        "none";


    spawnFood();


    animationFrameId =
        requestAnimationFrame(
            gameLoop
        );
}


/* =================================
   RESTART GAME
   ================================= */

function restartGame() {

    startGame();
}


/* =================================
   FOOD
   ================================= */

function spawnFood() {

    let valid = false;


    while (!valid) {

        /*
           Keep food away from the
           outer edge so its shape
           can never be clipped.
        */

        food = {

            x:
                Math.floor(
                    Math.random() *
                    (GRID - 4)
                ) + 2,

            y:
                Math.floor(
                    Math.random() *
                    (GRID - 4)
                ) + 2
        };


        valid =
            !snake.some(
                part =>
                    part.x === food.x &&
                    part.y === food.y
            );


        if (valid) {

            valid =
                !obstacles.some(
                    obstacle =>
                        obstacle.x === food.x &&
                        obstacle.y === food.y
                );
        }
    }


    /*
       Make sure the next fruit
       is different from the
       previous one whenever possible.
    */

    let nextFruit;

    do {

        nextFruit =
            fruits[
                Math.floor(
                    Math.random() *
                    fruits.length
                )
            ];

    } while (

        fruits.length > 1 &&
        nextFruit.type === currentFruit.type

    );


    currentFruit =
        nextFruit;


    foodPulse = 0;
}


/* =================================
   OBSTACLE SYSTEM
   ================================= */

function shouldAddObstacle() {

    return (
        score >= 4 &&
        score % 4 === 0
    );
}


function addObstacle() {

    if (
        obstacleCount >= 14
    ) {
        return;
    }


    let valid = false;

    let newObstacle;


    let attempts = 0;


    while (
        !valid &&
        attempts < 300
    ) {

        attempts++;


        newObstacle = {

            x:
                Math.floor(
                    Math.random() *
                    (GRID - 4)
                ) + 2,

            y:
                Math.floor(
                    Math.random() *
                    (GRID - 4)
                ) + 2
        };


        valid =
            !snake.some(
                part =>
                    part.x === newObstacle.x &&
                    part.y === newObstacle.y
            );


        if (
            valid &&
            food
        ) {

            valid =
                !(
                    newObstacle.x === food.x &&
                    newObstacle.y === food.y
                );
        }


        if (valid) {

            valid =
                !obstacles.some(
                    obstacle =>
                        obstacle.x === newObstacle.x &&
                        obstacle.y === newObstacle.y
                );
        }


        /*
           Don't put an obstacle directly
           beside the snake head.
        */

        if (
            valid &&
            snake[0]
        ) {

            const distance =
                Math.abs(
                    newObstacle.x -
                    snake[0].x
                ) +
                Math.abs(
                    newObstacle.y -
                    snake[0].y
                );


            if (
                distance < 4
            ) {

                valid = false;
            }
        }
    }


    if (!valid)
        return;


    obstacles.push(
        newObstacle
    );


    obstacleCount++;


    createObstacleAppearEffect(
        newObstacle.x,
        newObstacle.y
    );
}


/* =================================
   OBSTACLE APPEAR EFFECT
   ================================= */

function createObstacleAppearEffect(
    x,
    y
) {

    const centerX =
        x * tileSize +
        tileSize / 2;

    const centerY =
        y * tileSize +
        tileSize / 2;


    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI * 2;

        const speed =
            Math.random() * 3 + 1;


        obstacleParticles.push({

            x: centerX,

            y: centerY,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            size:
                Math.random() * 4 + 2,

            life: 1,

            color:
                "#ff8c00"
        });
    }
}


/* =================================
   OBSTACLE EXPLOSION
   ================================= */

function createObstacleExplosion(
    obstacle
) {

    const centerX =
        obstacle.x * tileSize +
        tileSize / 2;

    const centerY =
        obstacle.y * tileSize +
        tileSize / 2;


    screenShake = 16;

    obstacleFlash = 1;

    playExplosionSound();


    for (
        let i = 0;
        i < 35;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI * 2;

        const speed =
            Math.random() * 8 + 2;


        obstacleParticles.push({

            x: centerX,

            y: centerY,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            size:
                Math.random() * 7 + 2,

            life: 1,

            color:
                Math.random() > 0.5
                    ? "#ff3030"
                    : "#ff9f00"
        });
    }
}


/* =================================
   OBSTACLE COLLISION
   ================================= */

function checkObstacleCollision(
    head
) {

    return obstacles.some(
        obstacle =>
            obstacle.x === head.x &&
            obstacle.y === head.y
    );
}


/* =================================
   DRAW OBSTACLES
   ================================= */

function drawObstacles() {

    if (
        deathAnimation
    ) {
        return;
    }


    obstacles.forEach(
        obstacle => {

            const x =
                obstacle.x *
                tileSize +
                tileSize / 2;

            const y =
                obstacle.y *
                tileSize +
                tileSize / 2;


            const size =
                tileSize * 0.62;


            ctx.save();


            ctx.translate(
                x,
                y
            );


            ctx.rotate(
                Math.PI / 4
            );


            ctx.shadowBlur = 18;

            ctx.shadowColor =
                "#ff3030";


            ctx.fillStyle =
                "#161616";


            ctx.strokeStyle =
                "#ff3030";


            ctx.lineWidth = 2;


            ctx.beginPath();

            ctx.roundRect(
                -size / 2,
                -size / 2,
                size,
                size,
                tileSize * 0.10
            );

            ctx.fill();

            ctx.stroke();


            ctx.shadowBlur = 0;


            ctx.strokeStyle =
                "#ff9f00";

            ctx.lineWidth = 2;


            ctx.beginPath();

            ctx.moveTo(
                -size * 0.28,
                -size * 0.10
            );

            ctx.lineTo(
                size * 0.05,
                size * 0.22
            );

            ctx.lineTo(
                size * 0.27,
                -size * 0.25
            );

            ctx.stroke();


            ctx.restore();
        }
    );
}


/* =================================
   EAT ANIMATION
   ================================= */

function createEatEffect(
    x,
    y
) {

    const centerX =
        x * tileSize +
        tileSize / 2;

    const centerY =
        y * tileSize +
        tileSize / 2;


    for (
        let i = 0;
        i < 30;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI * 2;

        const speed =
            Math.random() * 5 + 2;


        foodParticles.push({

            x: centerX,

            y: centerY,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            size:
                Math.random() * 5 + 2,

            life: 1,

            color:
                currentFruit.color
        });
    }


    eatColorEffect = 1;
}


/* =================================
   DEATH EXPLOSION
   ================================= */

function createDeathExplosion() {

    deathAnimation = true;

    deathTimer = 0;

    screenShake = 20;

    redFlash = 1;


    snake.forEach(part => {

        const x =
            part.x * tileSize +
            tileSize / 2;

        const y =
            part.y * tileSize +
            tileSize / 2;


        for (
            let i = 0;
            i < 8;
            i++
        ) {

            const angle =
                Math.random() *
                Math.PI * 2;

            const speed =
                Math.random() * 7 + 2;


            particles.push({

                x: x,

                y: y,

                vx:
                    Math.cos(angle) *
                    speed,

                vy:
                    Math.sin(angle) *
                    speed,

                size:
                    Math.random() * 7 + 2,

                life: 1
            });
        }
    });
}


/* =================================
   UPDATE PARTICLES
   ================================= */

function updateParticles() {
    const now = performance.now();
    const dt = Math.min((now - lastParticleTime) / 16.6667, 2.0);
    lastParticleTime = now;

    // Keep particle counts bounded so mobile GPUs/CPUs do not get overloaded.
    if (particles.length > maxParticles) particles.length = maxParticles;
    if (foodParticles.length > maxFoodParticles) foodParticles.length = maxFoodParticles;
    if (obstacleParticles.length > maxObstacleParticles) obstacleParticles.length = maxObstacleParticles;

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= Math.pow(0.96, dt);
        p.vy *= Math.pow(0.96, dt);
        p.life -= 0.035 * dt;
        if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = foodParticles.length - 1; i >= 0; i--) {
        const p = foodParticles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= Math.pow(0.94, dt);
        p.vy *= Math.pow(0.94, dt);
        p.life -= 0.045 * dt;
        if (p.life <= 0) foodParticles.splice(i, 1);
    }

    for (let i = obstacleParticles.length - 1; i >= 0; i--) {
        const p = obstacleParticles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= Math.pow(0.93, dt);
        p.vy *= Math.pow(0.93, dt);
        p.life -= 0.04 * dt;
        if (p.life <= 0) obstacleParticles.splice(i, 1);
    }
}


/* =================================
   DRAW PARTICLES
   ================================= */

function drawParticles() {

    particles.forEach(p => {

        ctx.globalAlpha =
            p.life;

        ctx.fillStyle =
            currentSnakeColor.main;

        ctx.shadowBlur = 15;

        ctx.shadowColor =
            currentSnakeColor.main;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    });


    foodParticles.forEach(p => {

        ctx.globalAlpha =
            p.life;

        ctx.fillStyle =
            p.color ||
            currentFruit.color;

        ctx.shadowBlur = 15;

        ctx.shadowColor =
            p.color ||
            currentFruit.glow;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    });


    obstacleParticles.forEach(p => {

        ctx.globalAlpha =
            p.life;

        ctx.fillStyle =
            p.color;

        ctx.shadowBlur = 18;

        ctx.shadowColor =
            p.color;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    });


    ctx.globalAlpha = 1;

    ctx.shadowBlur = 0;
}


/* =================================
   UPDATE GAME
   ================================= */

function update() {

    direction =
        nextDirection;


    const head = {

        x:
            snake[0].x +
            direction.x,

        y:
            snake[0].y +
            direction.y
    };


    /*
       WALL
    */

    if (

        head.x < 0 ||

        head.x >= GRID ||

        head.y < 0 ||

        head.y >= GRID

    ) {

        die("wall");

        return;
    }


    /*
       OBSTACLE
    */

    const hitObstacle =
        obstacles.find(
            obstacle =>
                obstacle.x === head.x &&
                obstacle.y === head.y
        );


    if (
        hitObstacle
    ) {

        createObstacleExplosion(
            hitObstacle
        );


        obstacles =
            obstacles.filter(
                obstacle =>
                    obstacle !== hitObstacle
            );


        die("bomb");

        return;
    }


    /*
       BODY
    */

    if (

        snake.some(
            part =>
                part.x === head.x &&
                part.y === head.y
        )

    ) {

        die("self");

        return;
    }


    snake.unshift(head);


    /*
       APPLE / FRUIT
    */

    if (

        head.x === food.x &&

        head.y === food.y

    ) {

        createEatEffect(
            food.x,
            food.y
        );

        playEatSound();
        showFeedback();


        score++;

        scoreElement.textContent =
            score;


        /*
           Change snake color
           after every fruit.
        */

        let newColor;

        do {

            newColor =
                snakeColors[
                    Math.floor(
                        Math.random() *
                        snakeColors.length
                    )
                ];

        } while (

            snakeColors.length > 1 &&
            newColor.main ===
            currentSnakeColor.main

        );


        currentSnakeColor =
            newColor;


        if (
            score > highScore
        ) {

            highScore =
                score;


            localStorage.setItem(
                "theSnakeHighScore",
                highScore
            );


            highScoreElement.textContent =
                highScore;
        }


        gameSpeed =
            Math.max(
                48,
                115 - score * 3
            );


        /*
           Add an obstacle every
           4 points.
        */

        if (
            shouldAddObstacle()
        ) {

            addObstacle();
        }


        spawnFood();

    } else {

        snake.pop();
    }
}


/* =================================
   DIE
   ================================= */

function die(reason = "self") {

    if (deathAnimation)
        return;


    gameRunning = false;

    if (reason !== "bomb") {
        playLoseSound();
    }


    createDeathExplosion();


    setTimeout(
        () => {

            finalScore.textContent =
                score;

            gameOverReady = true;

            gameOver.style.display =
                "flex";

        },
        750
    );
}


/* =================================
   BACKGROUND
   ================================= */

function drawBackground() {

    if (
        !backgroundCache ||
        backgroundCacheSize !== canvas.width
    ) {
        backgroundCache =
            document.createElement("canvas");

        backgroundCache.width =
            canvas.width;

        backgroundCache.height =
            canvas.height;

        const bgCtx =
            backgroundCache.getContext("2d");

        bgCtx.fillStyle =
            "#090909";

        bgCtx.fillRect(
            0,
            0,
            backgroundCache.width,
            backgroundCache.height
        );

        bgCtx.strokeStyle =
            "#111";

        bgCtx.lineWidth = 1;

        for (
            let i = 0;
            i <= GRID;
            i++
        ) {
            bgCtx.beginPath();

            bgCtx.moveTo(
                i * tileSize,
                0
            );

            bgCtx.lineTo(
                i * tileSize,
                backgroundCache.height
            );

            bgCtx.stroke();

            bgCtx.beginPath();

            bgCtx.moveTo(
                0,
                i * tileSize
            );

            bgCtx.lineTo(
                backgroundCache.width,
                i * tileSize
            );

            bgCtx.stroke();
        }

        backgroundCacheSize =
            canvas.width;
    }

    ctx.drawImage(
        backgroundCache,
        0,
        0
    );
}

/* =================================
   DRAW FOOD
   ================================= */

function drawFood() {

    if (deathAnimation)
        return;


    foodPulse += 0.08;


    const pulse =
        1 +
        Math.sin(foodPulse) *
        0.10;


    const x =
        food.x * tileSize +
        tileSize / 2;

    const y =
        food.y * tileSize +
        tileSize / 2;


    ctx.save();


    ctx.translate(
        x,
        y
    );


    ctx.scale(
        pulse,
        pulse
    );


    const type =
        currentFruit.type;


    /*
       APPLE
    */

    if (
        type === "apple"
    ) {

        ctx.shadowBlur = 25;

        ctx.shadowColor =
            "#ff3030";

        ctx.fillStyle =
            "#ff3030";


        ctx.beginPath();

        ctx.arc(
            -tileSize * 0.08,
            0,
            tileSize * 0.27,
            0,
            Math.PI * 2
        );

        ctx.arc(
            tileSize * 0.08,
            0,
            tileSize * 0.27,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.beginPath();

        ctx.arc(
            0,
            tileSize * 0.08,
            tileSize * 0.30,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.shadowBlur = 0;

        ctx.strokeStyle =
            "#8b5a2b";

        ctx.lineWidth = 3;


        ctx.beginPath();

        ctx.moveTo(
            0,
            -tileSize * 0.22
        );

        ctx.lineTo(
            tileSize * 0.05,
            -tileSize * 0.38
        );

        ctx.stroke();


        ctx.fillStyle =
            "#00dd55";


        ctx.beginPath();

        ctx.ellipse(
            tileSize * 0.14,
            -tileSize * 0.34,
            tileSize * 0.14,
            tileSize * 0.06,
            -0.4,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    /*
       ORANGE
    */

    else if (
        type === "orange"
    ) {

        ctx.shadowBlur = 25;

        ctx.shadowColor =
            "#ff8c00";

        ctx.fillStyle =
            "#ff8c00";


        ctx.beginPath();

        ctx.arc(
            0,
            0,
            tileSize * 0.31,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.shadowBlur = 0;

        ctx.strokeStyle =
            "#8b5a2b";

        ctx.lineWidth = 2;


        ctx.beginPath();

        ctx.moveTo(
            0,
            -tileSize * 0.28
        );

        ctx.lineTo(
            tileSize * 0.04,
            -tileSize * 0.38
        );

        ctx.stroke();


        ctx.fillStyle =
            "#00dd55";


        ctx.beginPath();

        ctx.ellipse(
            tileSize * 0.12,
            -tileSize * 0.34,
            tileSize * 0.13,
            tileSize * 0.055,
            -0.5,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    /*
       LEMON
    */

    else if (
        type === "lemon"
    ) {

        ctx.shadowBlur = 25;

        ctx.shadowColor =
            "#ffe600";

        ctx.fillStyle =
            "#ffe600";


        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            tileSize * 0.36,
            tileSize * 0.24,
            -0.25,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.shadowBlur = 0;

        ctx.strokeStyle =
            "#d0a900";

        ctx.lineWidth = 2;


        ctx.beginPath();

        ctx.moveTo(
            -tileSize * 0.20,
            tileSize * 0.05
        );

        ctx.lineTo(
            tileSize * 0.20,
            -tileSize * 0.05
        );

        ctx.stroke();
    }


    /*
       STRAWBERRY
    */

    else if (
        type === "strawberry"
    ) {

        ctx.shadowBlur = 25;

        ctx.shadowColor =
            "#ff1744";

        ctx.fillStyle =
            "#ff1744";


        ctx.beginPath();

        ctx.moveTo(
            0,
            tileSize * 0.32
        );

        ctx.bezierCurveTo(
            -tileSize * 0.34,
            tileSize * 0.02,
            -tileSize * 0.28,
            -tileSize * 0.24,
            0,
            -tileSize * 0.18
        );

        ctx.bezierCurveTo(
            tileSize * 0.28,
            -tileSize * 0.24,
            tileSize * 0.34,
            tileSize * 0.02,
            0,
            tileSize * 0.32
        );

        ctx.fill();


        ctx.shadowBlur = 0;

        ctx.fillStyle =
            "#00dd55";


        ctx.beginPath();

        ctx.moveTo(
            -tileSize * 0.20,
            -tileSize * 0.18
        );

        ctx.lineTo(
            0,
            -tileSize * 0.35
        );

        ctx.lineTo(
            tileSize * 0.20,
            -tileSize * 0.18
        );

        ctx.lineTo(
            0,
            -tileSize * 0.12
        );

        ctx.closePath();

        ctx.fill();


        ctx.fillStyle =
            "#ffe600";


        for (
            let i = 0;
            i < 5;
            i++
        ) {

            const sx =
                (i - 2) *
                tileSize * 0.10;

            const sy =
                tileSize *
                (
                    0.00 +
                    Math.abs(i - 2) *
                    0.04
                );


            ctx.beginPath();

            ctx.ellipse(
                sx,
                sy,
                tileSize * 0.025,
                tileSize * 0.045,
                0,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }
    }


    /*
       GRAPE
    */

    else if (
        type === "grape"
    ) {

        ctx.shadowBlur = 25;

        ctx.shadowColor =
            "#9b59ff";

        ctx.fillStyle =
            "#9b59ff";


        const grapeSize =
            tileSize * 0.11;


        const grapes = [

            [-0.14, -0.14],
            [0.14, -0.14],

            [-0.21, 0.02],
            [0, 0.02],
            [0.21, 0.02],

            [-0.14, 0.18],
            [0.14, 0.18],

            [0, 0.32]

        ];


        grapes.forEach(
            position => {

                ctx.beginPath();

                ctx.arc(
                    position[0] *
                    tileSize,

                    position[1] *
                    tileSize,

                    grapeSize,

                    0,
                    Math.PI * 2
                );

                ctx.fill();
            }
        );


        ctx.shadowBlur = 0;

        ctx.strokeStyle =
            "#8b5a2b";

        ctx.lineWidth = 2;


        ctx.beginPath();

        ctx.moveTo(
            0,
            -tileSize * 0.18
        );

        ctx.lineTo(
            tileSize * 0.06,
            -tileSize * 0.36
        );

        ctx.stroke();


        ctx.fillStyle =
            "#00dd55";


        ctx.beginPath();

        ctx.ellipse(
            tileSize * 0.13,
            -tileSize * 0.31,
            tileSize * 0.13,
            tileSize * 0.06,
            -0.5,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    /*
       WATERMELON
    */

    else if (
        type === "watermelon"
    ) {

        ctx.shadowBlur = 25;

        ctx.shadowColor =
            "#00ff66";

        ctx.fillStyle =
            "#00dd55";


        ctx.beginPath();

        ctx.arc(
            0,
            0,
            tileSize * 0.32,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.fillStyle =
            "#ff4d6d";


        ctx.beginPath();

        ctx.arc(
            0,
            0,
            tileSize * 0.23,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.fillStyle =
            "#050505";


        const seeds = [

            [-0.10, -0.08],
            [0.10, -0.08],
            [-0.13, 0.10],
            [0.13, 0.10],
            [0, 0.18]

        ];


        seeds.forEach(
            seed => {

                ctx.beginPath();

                ctx.ellipse(
                    seed[0] *
                    tileSize,

                    seed[1] *
                    tileSize,

                    tileSize * 0.025,

                    tileSize * 0.045,

                    0,

                    0,
                    Math.PI * 2
                );

                ctx.fill();
            }
        );


        ctx.strokeStyle =
            "#00ff66";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            tileSize * 0.32,
            0,
            Math.PI * 2
        );

        ctx.stroke();
    }


    ctx.restore();
}


/* =================================
   DRAW SNAKE
   ================================= */

function drawSnake() {

    const alpha =
        deathAnimation
            ? Math.max(
                0,
                1 -
                deathTimer * 2
            )
            : 1;


    ctx.globalAlpha =
        alpha;


    snake.forEach(
        (part, index) => {

            let color;


            if (
                eatColorEffect > 0
            ) {

                color =
                    index === 0
                        ? "#ffffff"
                        : currentSnakeColor.main;

            } else {

                color =
                    index === 0
                        ? currentSnakeColor.main
                        : currentSnakeColor.body;
            }


            ctx.fillStyle =
                color;


            ctx.shadowBlur =
                index === 0
                    ? 18
                    : 8;

            ctx.shadowColor =
                color;


            const padding =
                tileSize * 0.07;


            ctx.beginPath();

            ctx.roundRect(

                part.x * tileSize +
                padding,

                part.y * tileSize +
                padding,

                tileSize -
                padding * 2,

                tileSize -
                padding * 2,

                tileSize * 0.18
            );

            ctx.fill();
        }
    );


    ctx.shadowBlur = 0;

    ctx.globalAlpha = 1;


    if (!deathAnimation)
        drawEyes();
}


/* =================================
   EYES
   ================================= */

function drawEyes() {

    const head =
        snake[0];


    ctx.fillStyle =
        "#050505";


    let eye1;
    let eye2;


    if (
        direction.x === 1
    ) {

        eye1 = {

            x:
                head.x * tileSize +
                tileSize * 0.72,

            y:
                head.y * tileSize +
                tileSize * 0.30
        };


        eye2 = {

            x:
                head.x * tileSize +
                tileSize * 0.72,

            y:
                head.y * tileSize +
                tileSize * 0.70
        };


    } else if (
        direction.x === -1
    ) {

        eye1 = {

            x:
                head.x * tileSize +
                tileSize * 0.28,

            y:
                head.y * tileSize +
                tileSize * 0.30
        };


        eye2 = {

            x:
                head.x * tileSize +
                tileSize * 0.28,

            y:
                head.y * tileSize +
                tileSize * 0.70
        };


    } else if (
        direction.y === -1
    ) {

        eye1 = {

            x:
                head.x * tileSize +
                tileSize * 0.30,

            y:
                head.y * tileSize +
                tileSize * 0.28
        };


        eye2 = {

            x:
                head.x * tileSize +
                tileSize * 0.70,

            y:
                head.y * tileSize +
                tileSize * 0.28
        };


    } else {

        eye1 = {

            x:
                head.x * tileSize +
                tileSize * 0.30,

            y:
                head.y * tileSize +
                tileSize * 0.72
        };


        eye2 = {

            x:
                head.x * tileSize +
                tileSize * 0.70,

            y:
                head.y * tileSize +
                tileSize * 0.72
        };
    }


    ctx.beginPath();

    ctx.arc(
        eye1.x,
        eye1.y,
        tileSize * 0.075,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        eye2.x,
        eye2.y,
        tileSize * 0.075,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* =================================
   DRAW
   ================================= */

function draw() {

    ctx.save();


    if (
        screenShake > 0
    ) {

        ctx.translate(

            (Math.random() - 0.5) *
            screenShake,

            (Math.random() - 0.5) *
            screenShake
        );


        screenShake *=
            0.88;


        if (
            screenShake < 0.2
        ) {

            screenShake = 0;
        }
    }


    drawBackground();

    drawObstacles();

    drawFood();

    drawSnake();

    drawParticles();


    if (
        redFlash > 0
    ) {

        ctx.fillStyle =
            `rgba(
                255,
                0,
                0,
                ${redFlash * 0.22}
            )`;


        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        redFlash *=
            0.90;
    }


    if (
        obstacleFlash > 0
    ) {

        ctx.fillStyle =
            `rgba(
                255,
                120,
                0,
                ${obstacleFlash * 0.18}
            )`;


        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        obstacleFlash *=
            0.88;
    }


    ctx.restore();
}


/* =================================
   GAME LOOP
   ================================= */

function gameLoop(time) {

    /*
       Fixed-step game updates:
       movement stays consistent even if
       the browser temporarily drops frames.
    */

    const frameDelta =
        Math.min(
            time - lastTime,
            100
        );

    lastTime = time;

    updateParticles();


    if (
        eatColorEffect > 0
    ) {

        eatColorEffect *=
            0.91;


        if (
            eatColorEffect < 0.02
        ) {

            eatColorEffect = 0;
        }
    }


    if (
        deathAnimation
    ) {

        deathTimer +=
            frameDelta / 1000;
    }


    if (
        gameRunning
    ) {

        /*
           Keep the snake on its fixed
           gameSpeed while allowing the
           renderer to remain smooth.
        */

        gameAccumulator +=
            frameDelta;

        let updates = 0;

        while (
            gameAccumulator >= gameSpeed &&
            updates < 4 &&
            gameRunning
        ) {

            update();

            gameAccumulator -=
                gameSpeed;

            updates++;
        }

        /*
           If a device freezes briefly,
           discard the excess backlog instead
           of creating a burst of updates.
        */

        if (
            updates >= 4
        ) {

            gameAccumulator = 0;
        }
    }


    draw();


    if (

        gameRunning ||

        particles.length > 0 ||

        foodParticles.length > 0 ||

        obstacleParticles.length > 0 ||

        redFlash > 0 ||

        obstacleFlash > 0

    ) {

        animationFrameId =
            requestAnimationFrame(
                gameLoop
            );

    } else {

        animationFrameId = null;
    }
}

/* =================================
   KEYBOARD
   ================================= */

document.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();


        if (

            key === "w" ||
            key === "arrowup"

        ) {

            event.preventDefault();

            if (
                direction.y !== 1
            ) {

                nextDirection = {
                    x: 0,
                    y: -1
                };
            }
        }


        else if (

            key === "s" ||
            key === "arrowdown"

        ) {

            event.preventDefault();

            if (
                direction.y !== -1
            ) {

                nextDirection = {
                    x: 0,
                    y: 1
                };
            }
        }


        else if (

            key === "a" ||
            key === "arrowleft"

        ) {

            event.preventDefault();

            if (
                direction.x !== 1
            ) {

                nextDirection = {
                    x: -1,
                    y: 0
                };
            }
        }


        else if (

            key === "d" ||
            key === "arrowright"

        ) {

            event.preventDefault();

            if (
                direction.x !== -1
            ) {

                nextDirection = {
                    x: 1,
                    y: 0
                };
            }
        }


        else if (
            key === " " &&
            !gameRunning &&
            gameOverReady
        ) {

            event.preventDefault();

            restartGame();
        }
    }
);


/* =================================
   DIRECTION
   ================================= */

function setDirection(
    x,
    y
) {

    if (
        x !== -direction.x ||
        y !== -direction.y
    ) {

        nextDirection = {
            x: x,
            y: y
        };
    }
}


/* =================================
   FULLSCREEN
   ================================= */

async function toggleFullscreen() {

    try {

        if (
            !document.fullscreenElement
        ) {

            if (
                document.documentElement
                    .requestFullscreen
            ) {

                await document.documentElement
                    .requestFullscreen();

            } else {

                document.body.classList.add(
                    "mobileFullscreen"
                );
            }

        } else {

            await document.exitFullscreen();
        }

    } catch (error) {

        /*
           Fallback for mobile browsers
           that restrict Fullscreen API.
        */

        document.body.classList.toggle(
            "mobileFullscreen"
        );
    }


    setTimeout(
        () => {

            resizeCanvas();

            if (
                snake &&
                food
            ) {

                draw();
            }

        },
        100
    );
}


/* =================================
   FULLSCREEN CHANGE
   ================================= */

document.addEventListener(
    "fullscreenchange",
    () => {

        resizeCanvas();

        if (
            snake &&
            food
        ) {

            draw();
        }
    }
);


/* =================================
   RESIZE
   ================================= */

window.addEventListener(
    "resize",
    () => {

        resizeCanvas();

        if (
            snake &&
            food
        ) {

            draw();
        }
    }
);


/* =================================
   START
   ================================= */

resizeCanvas();

startGame();

</script>
